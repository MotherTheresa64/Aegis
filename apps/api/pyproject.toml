[project]
name = "aegis-api"
version = "0.1.0"
description = "Aegis incident operations API"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116,<1",
  "uvicorn[standard]>=0.35,<1",
  "sqlalchemy>=2.0.43,<3",
  "asyncpg>=0.30,<1",
  "aiosqlite>=0.21,<1",
  "pydantic-settings>=2.10,<3",
  "pyjwt>=2.10,<3",
  "bcrypt>=4.3,<5",
  "redis>=6.4,<7",
  "celery>=5.5,<6",
  "email-validator>=2.2,<3"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<9",
  "httpx>=0.28,<1",
  "ruff>=0.12,<1"
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"
